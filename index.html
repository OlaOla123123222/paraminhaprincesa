<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05030a">
<title>Para você</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#05030a;overflow:hidden;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #msg{position:fixed;left:0;right:0;text-align:center;pointer-events:none;
    transform:translateY(-50%);font-family:"Great Vibes","Snell Roundhand","Apple Chancery",cursive;
    color:#fff;line-height:1.08;opacity:0;transition:opacity 1s ease;
    text-shadow:0 0 6px #000,0 0 14px rgba(255,45,122,.9),0 0 30px rgba(255,45,122,.6)}
  #msg .l{display:block;white-space:nowrap}
  #msg .c{display:inline-block;min-width:.22em}
  #msg .bin{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.5em;color:#ff9fcd;
    vertical-align:middle;text-shadow:0 0 8px #ff2d7a}
  #msg .heart{display:block;font-family:sans-serif;font-size:.45em;margin-top:.15em;color:#ff5a9c;
    opacity:0;transform:scale(.4);transition:opacity .8s ease,transform .8s cubic-bezier(.3,1.6,.5,1)}
  #msg .heart.on{opacity:1;transform:scale(1);animation:beat 1.3s ease-in-out 1s infinite}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}
  #hint{position:fixed;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom));text-align:center;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;letter-spacing:.12em;color:#ff9fcd;
    opacity:0;transition:opacity .8s ease;pointer-events:none}
  #hint.on{opacity:.85;animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg"><span class="l" data-t="Te amo"></span><span class="l" data-t="goianinha"></span><span class="heart"></span></div>
<div id="hint" class="on">toque na tela</div>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const off = document.createElement('canvas');
  const octx = off.getContext('2d', { willReadFrequently: true });
  const msg = document.getElementById('msg'), hint = document.getElementById('hint');
  const heart = msg.querySelector('.heart');

  let W, H, cell, cols, rows, bits, cx, cy, R, rain;
  let started = false, finished = false, t0 = 0, last = performance.now();

  // ---------- helpers ----------
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const easeOut = x => 1 - Math.pow(1 - x, 3);
  const lerp = (a, b, k) => a + (b - a) * k;
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, k) => { const A = hex(a), B = hex(b);
    return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',')})`; };

  // ---------- layout ----------
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cell = Math.max(7, Math.round(Math.min(W, H * 0.62) / 50));
    cols = Math.ceil(W / cell); rows = Math.ceil(H / cell);
    off.width = cols; off.height = rows;
    bits = new Uint8Array(cols * rows).map(() => Math.random() < .5 ? 0 : 1);
    cx = W / 2; cy = H * 0.4; R = Math.min(W * 0.44, H * 0.28);
    rain = Array.from({ length: cols }, () => ({ y: Math.random() * rows * 1.5 - rows * .5, s: 4 + Math.random() * 9 }));
    msg.style.top = cy + 'px';
    msg.style.fontSize = Math.round(R * 0.3) + 'px';
  }
  addEventListener('resize', resize);
  resize();

  // ---------- shapes (drawn small into the offscreen mask) ----------
  function petalPath(len, wid) {
    octx.beginPath(); octx.moveTo(0, 0);
    octx.bezierCurveTo(len * .22, -wid, len * .72, -wid * .95, len, 0);
    octx.bezierCurveTo(len * .72, wid * .95, len * .22, wid, 0, 0);
  }

  function petal(x, y, ang, len, wid, open, inner, seed) {
    octx.save(); octx.translate(x, y); octx.rotate(ang);
    petalPath(len, wid);
    const g = octx.createLinearGradient(0, 0, len, 0);
    // bud = green -> pale pink; open = deep pink center -> white tips
    g.addColorStop(0, mix('#6fbf5a', inner ? '#ff2f86' : '#e81f74', open));
    g.addColorStop(.5, mix('#b9dd8f', inner ? '#ff86bd' : '#ff6aa9', open));
    g.addColorStop(1, mix('#ffd9ea', '#fff3f8', open));
    octx.fillStyle = g; octx.fill();
    if (open > .3) {
      octx.globalAlpha = (open - .3) / .7;
      // midrib
      octx.strokeStyle = '#c2105a'; octx.lineWidth = cell * 0.9;
      octx.beginPath(); octx.moveTo(len * .08, 0); octx.quadraticCurveTo(len * .5, wid * .08, len * .82, 0); octx.stroke();
      // stargazer-like spots
      octx.fillStyle = '#b0084d';
      for (let k = 0; k < 5; k++) {
        const px = len * (.18 + .09 * k), py = ((seed * 7 + k * 3) % 5 - 2) * wid * .16;
        octx.beginPath(); octx.arc(px, py, cell * .75, 0, 7); octx.fill();
      }
      octx.globalAlpha = 1;
    }
    octx.restore();
  }

  function leaf(x, y, ang, len, wid) {
    octx.save(); octx.translate(x, y); octx.rotate(ang);
    petalPath(len, wid);
    const g = octx.createLinearGradient(0, 0, len, 0);
    g.addColorStop(0, '#2e9e4c'); g.addColorStop(1, '#8be07a');
    octx.fillStyle = g; octx.fill();
    octx.strokeStyle = '#1d7a39'; octx.lineWidth = cell * .8;
    octx.beginPath(); octx.moveTo(0, 0); octx.lineTo(len * .85, 0); octx.stroke();
    octx.restore();
  }

  function stemPoint(k, sway) {
    const x0 = cx + W * 0.04, y0 = H + cell * 2;
    const x1 = cx - W * 0.14, y1 = H * 0.72;
    const x2 = cx + sway, y2 = cy;
    const u = 1 - k;
    return [u * u * x0 + 2 * u * k * x1 + k * k * x2, u * u * y0 + 2 * u * k * y1 + k * k * y2];
  }

  function drawScene(t) {
    octx.setTransform(1, 0, 0, 1, 0, 0);
    octx.clearRect(0, 0, cols, rows);
    octx.setTransform(1 / cell, 0, 0, 1 / cell, 0, 0);
    octx.lineCap = 'round'; octx.lineJoin = 'round';

    const stem = ease(prog(t, 0, 3.2));
    const leafP = easeOut(prog(t, 2.2, 4.4));
    const bud = easeOut(prog(t, 3.0, 4.4));
    const open = ease(prog(t, 4.6, 8.4));
    const sway = Math.sin(t * 0.9) * R * 0.025 * clamp(t / 4);

    // stem
    if (stem > 0) {
      octx.strokeStyle = '#3fae57';
      octx.lineWidth = Math.max(cell * 1.8, R * 0.06);
      octx.beginPath();
      const n = 48;
      for (let i = 0; i <= n; i++) {
        const [x, y] = stemPoint(stem * i / n, sway);
        i ? octx.lineTo(x, y) : octx.moveTo(x, y);
      }
      octx.stroke();
    }

    // leaves
    if (leafP > 0) {
      const [lx, ly] = stemPoint(0.42, sway), [rx, ry] = stemPoint(0.6, sway);
      leaf(lx, ly, -Math.PI * 0.86 + Math.sin(t * .8) * .03, R * 0.85 * leafP, R * 0.13 * leafP);
      leaf(rx, ry, -Math.PI * 0.16 + Math.sin(t * .8 + 1) * .03, R * 0.72 * leafP, R * 0.11 * leafP);
    }

    // flower
    if (bud > 0) {
      const fx = cx + sway, fy = cy;
      const breathe = 1 + Math.sin(t * 1.4) * 0.012 * open;
      const order = [0, 2, 4, 1, 3, 5]; // outer petals first, inner on top
      for (const i of order) {
        const inner = i % 2 === 1;
        const a0 = -Math.PI / 2 + (i - 2.5) * 0.07;
        const a1 = -Math.PI / 2 + (i - 2.5) * (Math.PI / 3);
        const ang = lerp(a0, a1, open);
        const len = lerp(R * 0.62 * bud, R * (inner ? 0.95 : 1), open) * breathe;
        const wid = lerp(R * 0.1, R * (inner ? 0.25 : 0.3), open);
        petal(fx, fy, ang, len, wid, open, inner, i);
      }
      // stamens
      const s = prog(open, 0.6, 1);
      if (s > 0) {
        octx.globalAlpha = s;
        for (let i = 0; i < 6; i++) {
          const a = -Math.PI / 2 + (i - 2.5) * (Math.PI / 3) + Math.PI / 6 * (i < 3 ? 1 : -1) * 0 + (Math.PI / 6);
          const L = R * 0.55 * s;
          const ex = fx + Math.cos(a) * L, ey = fy + Math.sin(a) * L;
          octx.strokeStyle = '#a8d672'; octx.lineWidth = cell * .8;
          octx.beginPath(); octx.moveTo(fx, fy); octx.lineTo(ex, ey); octx.stroke();
          octx.fillStyle = '#ff9f1c';
          octx.beginPath(); octx.ellipse(ex, ey, cell * 1.6, cell * .9, a + Math.PI / 2, 0, 7); octx.fill();
        }
        octx.fillStyle = '#d8ef7a';
        octx.beginPath(); octx.arc(fx, fy, cell * 1.8, 0, 7); octx.fill();
        octx.globalAlpha = 1;
      }
    }
    return open;
  }

  // ---------- message decode ----------
  const letters = [];
  msg.querySelectorAll('.l').forEach(line => {
    for (const ch of line.dataset.t) {
      const sp = document.createElement('span'); sp.className = 'c';
      sp.dataset.ch = ch; sp.textContent = ch === ' ' ? ' ' : '';
      line.appendChild(sp); if (ch !== ' ') letters.push(sp);
    }
  });
  function resetMsg() {
    letters.forEach(sp => { sp.textContent = ''; sp.classList.remove('bin'); sp.dataset.done = ''; });
    msg.style.opacity = 0; heart.classList.remove('on');
  }
  function updateMsg(t) {
    const T = t - 8.4;
    if (T < 0) return;
    msg.style.opacity = 1;
    letters.forEach((sp, i) => {
      if (sp.dataset.done) return;
      const appear = i * 0.12, resolve = 0.7 + i * 0.2;
      if (T < appear) return;
      if (T >= resolve) { sp.textContent = sp.dataset.ch; sp.classList.remove('bin'); sp.dataset.done = '1'; }
      else { sp.classList.add('bin'); if (Math.random() < .35) sp.textContent = Math.random() < .5 ? '0' : '1'; }
    });
    if (T > 0.9 + letters.length * 0.2) heart.classList.add('on');
    if (!finished && T > 2.6 + letters.length * 0.2) {
      finished = true; hint.textContent = 'toque para ver de novo'; hint.classList.add('on');
    }
  }

  // ---------- render loop ----------
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const t = started ? (now - t0) / 1000 : 0;

    ctx.fillStyle = '#05030a'; ctx.fillRect(0, 0, W, H);
    ctx.font = `bold ${cell}px ui-monospace,Menlo,Consolas,monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

    // faint binary rain in the background
    const rainA = started ? 0.05 + 0.1 * clamp(t / 2) : 0.08;
    for (let c = 0; c < cols; c++) {
      const d = rain[c]; d.y += d.s * dt;
      if (d.y - 10 > rows) { d.y = -Math.random() * rows * .4; d.s = 4 + Math.random() * 9; }
      for (let k = 0; k < 10; k++) {
        const r = Math.floor(d.y) - k; if (r < 0 || r >= rows) continue;
        ctx.fillStyle = k === 0 ? `rgba(255,190,220,${rainA * 1.8})` : `rgba(255,95,162,${rainA * (1 - k / 10)})`;
        ctx.fillText(bits[r * cols + c], c * cell + cell / 2, r * cell + cell / 2);
      }
    }

    if (started) {
      const open = drawScene(t);
      const img = octx.getImageData(0, 0, cols, rows).data;
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        const k = r * cols + c, i = k * 4, a = img[i + 3];
        if (a < 70) continue;
        if (Math.random() < 0.025) bits[k] ^= 1;
        const fl = 0.82 + Math.random() * 0.18;
        ctx.fillStyle = `rgba(${img[i]},${img[i + 1]},${img[i + 2]},${(a / 255) * fl})`;
        ctx.fillText(bits[k], c * cell + cell / 2, r * cell + cell / 2);
      }
      // soft dark glow behind the message so it reads clearly
      const m = prog(t, 8.0, 9.5);
      if (m > 0) {
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 0.72);
        g.addColorStop(0, `rgba(5,3,10,${0.78 * m})`);
        g.addColorStop(0.6, `rgba(5,3,10,${0.5 * m})`);
        g.addColorStop(1, 'rgba(5,3,10,0)');
        ctx.fillStyle = g; ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
      }
      updateMsg(t);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function start() {
    if (started && !finished) return;
    started = true; finished = false; t0 = performance.now();
    hint.classList.remove('on'); resetMsg();
  }
  addEventListener('pointerdown', start);
  addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') start(); });
})();
</script>
</body>
</html>
